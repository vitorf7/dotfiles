  wheel_step_size: 100.0
  wheel_step_size_large: 500.0
classname: AppConfig
custom_monitor_assignments: []
custom_mouse_scaling: 1.0
custom_mouse_screen_offset_scaling: 1.0
custom_overlay_scaling: 1.0
debug_options: {}
display_input: none
event_tap_location: hid_head
excluded_input_devices:
- MX Master 3
- OpenLogi
general_settings:
  automatically_check_for_updates: true
  check_for_preview_releases: true
  hide_welcome_screen: true
  ignore_update_to_version: null
grid_configs:
- always_show_subgrid: false
  grid_defn:
  - border_width: 0.0
    callback: build_cell_strings
    keys: QWERT ASDFG ZXCVB YUIOP HJKL; NM,./
    num_cells_x: 5
    num_cells_y: 5
  - border_width: 1.0
    callback: build_cell_strings
    keys: QWERT ASDFG ZXCVB YUIOP HJKL; NM,./
    num_cells_x: 5
    num_cells_y: 6
  - border_width: 0.0
    callback: apply_strings_and_subgrid_to_cells
    keys: ''
    num_cells_x: 2
    num_cells_y: 1
  hold_subgrid_key_for_nudge: false
  name: position_based_columns
  nudges_per_cell: 4
  strategy: subgrid
  subgrid_cols: 8
  subgrid_mouse_action_keys: QWERT YUIOP ASDFG HJKL; ZXCVB NM,./
  subgrid_rows: 3
